<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f13">
<title>Neural Quiz · Epoch / Batch / Logit</title>
<style>
  :root {
    --bg: #0b0b0f; --card: #16161f; --card-border: #2a2a38;
    --accent: #8b5cf6; --accent-glow: rgba(139, 92, 246, 0.25);
    --gold: #fbbf24; --gold-glow: rgba(251, 191, 36, 0.3);
    --green: #10b981; --red: #f43f5e; --text: #f1f1f6; --muted: #8b8ba0; --opt-bg: #111118;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 0 2.5rem; -webkit-tap-highlight-color: transparent;
  }
  .nav { position: sticky; top: 0; z-index: 40; width: 100%; background: var(--bg); border-bottom: 1px solid var(--card-border); }
  .nav__in { max-width: 480px; margin: 0 auto; padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .nav__brand { display: flex; align-items: center; gap: 8px; margin-right: auto; text-decoration: none; color: inherit; }
  .nav__mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.3); color: var(--accent); font-size: 10px; font-weight: 600; }
  .nav__title { font-size: .9rem; color: var(--text); }
  .nav__links { display: flex; gap: 2px; flex-wrap: wrap; }
  .nav__link { padding: 5px 8px; border-radius: 999px; font-size: 10px; color: var(--muted); text-decoration: none; }
  .nav__link.is-active { color: var(--accent); background: rgba(139,92,246,.12); }
  .header { text-align: center; margin: 1.2rem 0 1rem; width: 100%; max-width: 440px; padding: 0 1rem; }
  .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.15rem; }
  .header p { font-size: 0.78rem; color: var(--muted); }
  #app { width: 100%; max-width: 440px; padding: 0 1rem; }
  .score-bar { display: flex; justify-content: space-between; margin-bottom: 0.85rem; font-size: 0.8rem; color: var(--muted); }
  .score-bar strong { color: var(--green); }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 1.3rem 1.15rem; }
  .card.final { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 32px var(--gold-glow); }
  .q-num { font-size: 0.7rem; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 0.45rem; text-transform: uppercase; }
  .q-num.final-num { color: var(--gold); }
  .millionaire-intro { font-size: 0.82rem; line-height: 1.5; color: var(--muted); margin-bottom: 1rem; padding: 0.75rem 0.85rem; background: rgba(251,191,36,0.08); border-radius: 12px; border-left: 3px solid var(--gold); }
  .q-text { font-size: 1.02rem; line-height: 1.48; margin-bottom: 1.15rem; font-weight: 500; }
  .opts { display: flex; flex-direction: column; gap: 0.48rem; }
  .opt { background: var(--opt-bg); border: 1px solid var(--card-border); border-radius: 13px; padding: 0.88rem 0.95rem; font-size: 0.9rem; cursor: pointer; }
  .opt.correct { border-color: var(--green); background: rgba(16,185,129,0.12); color: var(--green); }
  .opt.wrong { border-color: var(--red); background: rgba(244,63,94,0.12); color: var(--red); }
  .opt.disabled { pointer-events: none; opacity: 0.78; }
  .explain { margin-top: 0.95rem; padding: 0.8rem 0.9rem; background: #0e0e14; border-radius: 11px; font-size: 0.83rem; color: var(--muted); border-left: 3px solid var(--accent); }
  .btn-row { margin-top: 1.15rem; }
  button { width: 100%; border: none; border-radius: 13px; padding: 0.92rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  button:disabled { opacity: 0.32; }
  .btn-next { background: var(--accent); color: #fff; box-shadow: 0 4px 18px var(--accent-glow); }
  .btn-next.final-btn { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .btn-restart { background: transparent; border: 1px solid var(--card-border); color: var(--text); margin-top: 0.6rem; }
  .result { text-align: center; padding: 1.6rem 0.8rem 1.2rem; }
  .result h2 { font-size: 2.1rem; font-weight: 700; margin-bottom: 0.35rem; }
  .result .msg { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.5rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <div class="nav__in">
    <a class="nav__brand" href="../"><span class="nav__mark">AI</span><span class="nav__title">Field Guide</span></a>
    <div class="nav__links">
      <a class="nav__link" href="../">Hub</a>
      <a class="nav__link" href="../opener/">Opener</a>
      <a class="nav__link" href="../glossary/">Glossary</a>
      <a class="nav__link" href="../game/">Game</a>
      <a class="nav__link is-active" href="../neural/">Neural</a>
    </div>
  </div>
</nav>

<div class="header">
  <h1>🧠 Neural Net Quiz</h1>
  <p>Epoch · Batch · Logit · Learning Rate · Dropout</p>
</div>

<div id="app">
  <div class="score-bar">
    <span>Հարց <strong id="cur">1</strong> / <span id="total">10</span></span>
    <span>Միավոր՝ <strong id="score">0</strong></span>
  </div>
  <div class="card" id="quiz-card">
    <div class="q-num" id="q-num"></div>
    <div id="millionaire-intro" class="millionaire-intro hidden"></div>
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
    <div class="explain hidden" id="explain"></div>
    <div class="btn-row"><button class="btn-next" id="btn-next" disabled>Հաջորդ →</button></div>
  </div>
  <div class="card result hidden" id="result">
    <h2 id="final-title"></h2>
    <p class="msg" id="final-msg"></p>
    <button class="btn-restart" id="btn-restart">Կրկին խաղալ</button>
  </div>
</div>

<script>
const questions = [
  {id:1,text:"Ի՞նչ է կոչվում մեկ ամբողջական անցումը ամբողջ տվյալների բազայի վրայով:",options:[{key:"Ա",text:"Բեթչ (Batch)"},{key:"Բ",text:"Էպոխա (Epoch)"},{key:"Գ",text:"Լոգիտ (Logit)"},{key:"Դ",text:"Softmax"}],correct:"Բ",explain:"Էպոխան (Epoch) հենց մեկ ամբողջական անցումն է տվյալների վրայով։"},
  {id:2,text:"Ի՞նչ է անում Softmax ֆունկցիան:",options:[{key:"Ա",text:"Քաշերը թարմացնում է"},{key:"Բ",text:"Կորուստը հաշվարկում է"},{key:"Գ",text:"Հում թվերը դարձնում է հավանականություններ (0-1, գումարը=1)"},{key:"Դ",text:"Բեթչերը բաժանում է"}],correct:"Գ",explain:"Softmax-ը logits-ները վերածում է հավանականությունների, որոնց գումարը միշտ 1 է։"},
  {id:3,text:"Ի՞նչ է տեղի ունենում գերուսուցման (Overfitting) ժամանակ:",options:[{key:"Ա",text:"Մոդելը չի սովորում ոչինչ"},{key:"Բ",text:"Մոդելը չափից դուրս «անգիր է անում» հին տվյալները և վատ է աշխատում նորերի վրա"},{key:"Գ",text:"Learning Rate-ը դառնում է 0"},{key:"Դ",text:"Բոլոր նկարները ջնջվում են"}],correct:"Բ",explain:"Overfitting — մոդելը հիշում է training set-ը, բայց չի գեներալիզացնում։"},
  {id:4,text:"Ի՞նչ է կոչվում նեյրոնային ցանցի վերջին շերտի արտադրած հում, չնորմավորված թվերի զանգվածը (մինչև Softmax):",options:[{key:"Ա",text:"Բեթչ (Batch)"},{key:"Բ",text:"Լոգիտներ (Logits)"},{key:"Գ",text:"Շեղում (Bias)"},{key:"Դ",text:"Կորուստ (Loss)"}],correct:"Բ",explain:"Logits — վերջին շերտի հում թվերն են։ Softmax-ից հետո դառնում են հավանականություն։"},
  {id:5,text:"Եթե տվյալների բազան շատ մեծ է, մենք այն բաժանում ենք փոքր խմբերի, որպեսզի հիշողությունը չծանրաբեռնվի։ Ի՞նչ է կոչվում այդ փոքր խումբը:",options:[{key:"Ա",text:"Բեթչ (Batch)"},{key:"Բ",text:"Էպոխա (Epoch)"},{key:"Գ",text:"Նեյրոն (Neuron)"},{key:"Դ",text:"Օպտիմիզատոր (Optimizer)"}],correct:"Ա",explain:"Batch — տվյալների փոքր խումբ, որը մեկ անգամ է մտնում ցանց։"},
  {id:6,text:"Ի՞նչ դեր ունի Ուսուցման արագությունը (Learning Rate):",options:[{key:"Ա",text:"Որոշում է, թե քանի էպոխա պետք է տևի ուսուցումը"},{key:"Բ",text:"Չափում է մոդելի վերջնական ճշգրտությունը"},{key:"Գ",text:"Որոշում է, թե որքան մեծ/փոքր քայլերով պետք է փոխվեն քաշերը"},{key:"Դ",text:"Արագացնում է կոդի գրման գործընթացը"}],correct:"Գ",explain:"Learning Rate = քաշերի թարմացման քայլի չափը։"},
  {id:7,text:"Ունեք 1000 լուսանկար։ Բաժանում եք 10 խմբի (յուրաքանչյուրում 100 նկար) և հերթով տալիս ցանցին։ Ի՞նչ է կոչվում այդ 100 նկարից բաղկացած խումբը:",options:[{key:"Ա",text:"Էպոխա (Epoch)"},{key:"Բ",text:"Բեթչ (Batch)"},{key:"Գ",text:"Լոգիտ (Logit)"},{key:"Դ",text:"Օպտիմիզատոր (Optimizer)"}],correct:"Բ",explain:"100 նկար = մեկ Batch։"},
  {id:8,text:"Երբ ցանցը մշակում է բոլոր 10 խմբերը (տեսնում է բոլոր 1000 նկարները մեկ անգամ), ուսուցման ո՞ր փուլն է համարվում ավարտված:",options:[{key:"Ա",text:"Ուսուցման արագություն (Learning Rate)"},{key:"Բ",text:"Լոգիտ (Logit)"},{key:"Գ",text:"Մեկ էպոխա (One Epoch complete)"},{key:"Դ",text:"Ակտիվացման ֆունկցիա (Activation Function)"}],correct:"Գ",explain:"Բոլոր batch-երը մեկ անգամ անցնել = 1 Epoch։"},
  {id:9,text:"Եթե Learning Rate-ը սահմանված է չափազանց մեծ, ի՞նչ տեղի կունենա:",options:[{key:"Ա",text:"Մոդելը կանի չափից դուրս մեծ քայլեր և կարող է բաց թողնել լավագույն լուծումը"},{key:"Բ",text:"Կոդը կաշխատի ավելի դանդաղ"},{key:"Գ",text:"Բոլոր նկարները ավտոմատ կջնջվեն"},{key:"Դ",text:"Մոդելը կդառնա 100% անսխալական"}],correct:"Ա",explain:"Չափազանց մեծ LR → overshooting / divergence։"},
  {id:10,final:true,text:"Մեքենայական ուսուցման մեջ, երբ մենք ավելացնում ենք Dropout շերտը նեյրոնային ցանցի մեջ, այն մարզման ժամանակ պատահականորեն «անջատում» է նեյրոնների մի մասը։ Ո՞րն է այս հնարքի գլխավոր նպատակը:",options:[{key:"Ա",text:"Արագացնել կոդի գործարկումը և խնայել համակարգչի հիշողությունը"},{key:"Բ",text:"Կանխել Գերուսուցումը (Overfitting), որպեսզի մոդելը չանգիր անի տվյալները"},{key:"Գ",text:"Փոխարինել Softmax ֆունկցիային և հաշվել հավանականությունները"},{key:"Դ",text:"Մոդելի բոլոր մուտքային տվյալները (Logits) դարձնել 5,000,000"}],correct:"Բ",explain:"Dropout-ի գլխավոր նպատակը Overfitting-ի կանխումն է։ Պատահականորեն անջատելով նեյրոններ՝ մոդելը չի կարող «անգիր անել» training տվյալները և ավելի լավ է գեներալիզացնում։"}
];
let idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);
const render=()=>{
  const q=questions[idx],isFinal=!!q.final;
  $('cur').textContent=idx+1;$('total').textContent=questions.length;$('score').textContent=score;
  const card=$('quiz-card'),qNum=$('q-num'),intro=$('millionaire-intro'),btn=$('btn-next');
  if(isFinal){card.classList.add('final');qNum.classList.add('final-num');qNum.textContent='5,000,000$ ՀԱՐՑ';intro.classList.remove('hidden');intro.innerHTML='(Բարձրանում է լարված երաժշտությունը...) 🤫<br><br>Բարի գալուստ «Ո՞վ է ուզում դառնալ միլիոնատեր» խաղի վերջին՝ <strong>5,000,000 դոլարանոց</strong> մեծ հարցին։';btn.classList.add('final-btn');btn.textContent='Վերջնական պատասխան →';}
  else{card.classList.remove('final');qNum.classList.remove('final-num');qNum.textContent=`Հարց ${q.id}`;intro.classList.add('hidden');btn.classList.remove('final-btn');btn.textContent='Հաջորդ →';}
  $('q-text').textContent=q.text;$('explain').classList.add('hidden');btn.disabled=true;answered=false;
  const opts=$('opts');opts.innerHTML='';
  q.options.forEach(o=>{const el=document.createElement('div');el.className='opt';el.textContent=`${o.key}) ${o.text}`;el.dataset.key=o.key;el.onclick=()=>select(el,o.key);opts.appendChild(el);});
};
const select=(el,key)=>{
  if(answered)return;answered=true;const q=questions[idx];
  [...$('opts').children].forEach(o=>{o.classList.add('disabled');if(o.dataset.key===q.correct)o.classList.add('correct');});
  if(key===q.correct){el.classList.add('correct');score++;$('score').textContent=score;}else el.classList.add('wrong');
  $('explain').textContent=q.explain;$('explain').classList.remove('hidden');$('btn-next').disabled=false;
};
$('btn-next').onclick=()=>{idx++;if(idx>=questions.length)showResult();else render();};
const showResult=()=>{
  $('quiz-card').classList.add('hidden');$('result').classList.remove('hidden');
  const pct=Math.round((score/questions.length)*100);
  $('final-title').textContent=`${score}/${questions.length}`;
  let msg=score===10?'🎉 ՄԻԼԻՈՆԱՏԵՐ ԵՔ։ Dropout-ը, Epoch-ը, Batch-ը, Logit-ը և LR-ը — ամեն ինչ ձեր գրպանում է։':pct>=80?'Շատ մոտ է։ Dropout-ը Overfitting-ի դեմ է։':pct>=60?'Լավ է։ Մի քիչ կրկնիր Batch vs Epoch և Dropout։':'Կրկնիր տերմինները։ Batch = խումբ, Epoch = ամբողջ անցում, Dropout = anti-overfitting։';
  $('final-msg').textContent=msg;
};
$('btn-restart').onclick=()=>{idx=0;score=0;$('result').classList.add('hidden');$('quiz-card').classList.remove('hidden');render();};
render();
</script>
</body>
</html>
